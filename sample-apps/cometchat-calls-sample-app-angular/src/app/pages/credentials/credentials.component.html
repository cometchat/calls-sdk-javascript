<div class="container">
  <div class="logo">
    <img src="assets/cometchat-logo.svg" alt="CometChat" />
  </div>

  <div class="form">
    <div class="title-wrapper">
      <h2 class="title">App Credentials</h2>
    </div>

    <div class="form-content">
      <div class="field-group">
        <label class="field-label">Region</label>
        <div class="region-row">
          @for (region of regions; track region.key) {
            <button
              type="button"
              class="region-button"
              [class.region-button-selected]="selectedRegion === region.key"
              (click)="selectRegion(region.key)"
              [attr.aria-pressed]="selectedRegion === region.key"
            >
              <img [src]="region.flag" [alt]="region.label + ' flag'" class="flag-icon" />
              <span class="region-label">{{ region.label }}</span>
            </button>
          }
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="app-id-input">App ID</label>
        <div class="input-wrapper">
          <input
            id="app-id-input"
            class="input"
            type="text"
            placeholder="Enter the app ID"
            [(ngModel)]="appId"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="auth-key-input">Auth Key</label>
        <div class="input-wrapper">
          <input
            id="auth-key-input"
            class="input"
            type="text"
            placeholder="Enter the Auth Key"
            [(ngModel)]="authKey"
          />
        </div>
      </div>

      <button class="continue-button" type="button" (click)="submit()">
        <span class="continue-button-text">Continue</span>
      </button>
    </div>
  </div>
</div>
